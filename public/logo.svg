<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BASTO GYM">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFF1A0"/><stop offset="0.2" stop-color="#FFCB2E"/>
      <stop offset="0.6" stop-color="#F29B00"/><stop offset="1" stop-color="#9A5600"/>
    </linearGradient>
    <linearGradient id="goldBracket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE57A"/><stop offset="0.5" stop-color="#FFB400"/><stop offset="1" stop-color="#B86A00"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#4d5056"/><stop offset="0.22" stop-color="#18191c"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="blackBracket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b6e75"/><stop offset="0.45" stop-color="#2a2c30"/><stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C6C9CF"/><stop offset="1" stop-color="#6E727A"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E4E6EA"/><stop offset="1" stop-color="#A6AAB2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#26282c"/><stop offset="1" stop-color="#070708"/>
    </radialGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFBE0" stop-opacity="1"/><stop offset="0.25" stop-color="#FFC84A" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FF9A00" stop-opacity="0.35"/><stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>

    <!-- Cuerpo: las letras forman el hexágono (arriba plano a la izquierda, inclinado a la derecha, abajo en V) -->
    <path id="body" d="M150 150 H262 L414 227 V365 L256 458 L98 365 V205 Z"/>
    <clipPath id="clipBody"><use href="#body"/></clipPath>
    <path id="Bshape" fill-rule="evenodd" d="M150 150 H236 L262 176 V236 L248 250 L266 264 V452 L256 458 L98 365 V205 Z"/>
    <path id="Gshape" d="M262 150 L414 227 V365 L262 454.5 Z"/>
    <clipPath id="clipB"><use href="#Bshape"/></clipPath>
    <clipPath id="clipG"><use href="#Gshape"/></clipPath>
    <!-- Huecos plateados -->
    <path id="Bc" d="M158 172 H228 L242 186 V224 L228 238 H158 Z M158 290 H232 L248 306 V352 L232 368 H158 Z"/>
    <path id="Gc" d="M302 214 L372 249.5 V272 H414 V304 H334 V338 H372 V372 H302 Z"/>
  </defs>

  <g transform="translate(0 -6)">
    <!-- "Techo": dos soportes con gancho, negro a la izquierda y dorado a la derecha -->
    <path id="bkL" d="M58.6 215 V148 L246 39.8 V69.9 L84.6 163 V215 Z" fill="url(#blackBracket)" stroke="url(#silver)" stroke-width="3" stroke-linejoin="round"/>
    <path id="bkR" d="M453.4 215 V148 L266 39.8 V69.9 L427.4 163 V215 Z" fill="url(#goldBracket)" stroke="#FFF3B8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- brillo en el canto de cada soporte -->
    <path d="M70 148 L240 50" stroke="#fff" stroke-opacity="0.35" stroke-width="2" fill="none"/>
    <path d="M442 148 L272 50" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none"/>

    <!-- Contorno plateado fino de la base (doble línea en V) -->
    <path d="M58.6 232 V376 L256 490 L453.4 376 V232" fill="none" stroke="url(#silver)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M74 236 V368 L256 474 L438 368 V236" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2" stroke-linejoin="round"/>

    <!-- G dorada -->
    <use href="#Gshape" fill="#FFF8C9"/>
    <g clip-path="url(#clipG)">
      <use href="#Gshape" fill="url(#gold)" transform="translate(5 5)"/>
      <rect x="262" y="150" width="160" height="110" fill="url(#gloss)" opacity="0.5"/>
      <use href="#Gshape" fill="none" stroke="#FFF6C0" stroke-opacity="0.42" stroke-width="12"/>
      <use href="#Gc" fill="url(#counter)"/>
      <!-- sombra del borde interior del hueco -->
      <use href="#Gc" fill="none" stroke="#6b3f00" stroke-opacity="0.45" stroke-width="2.5"/>
    </g>

    <!-- B negra -->
    <use href="#Bshape" fill="url(#silver)" fill-rule="evenodd"/>
    <g clip-path="url(#clipB)">
      <use href="#Bshape" fill="url(#black)" fill-rule="evenodd" transform="translate(5 5)"/>
      <rect x="98" y="150" width="170" height="90" fill="url(#gloss)" opacity="0.3"/>
      <use href="#Bshape" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="12" fill-rule="evenodd"/>
      <use href="#Bc" fill="url(#counter)"/>
      <use href="#Bc" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="2.5"/>
    </g>
    <!-- línea de unión B | G -->
    <path d="M263 176 V236 L249 250 L267 264 V452" fill="none" stroke="#000" stroke-opacity="0.7" stroke-width="2.2"/>
    <use href="#body" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- Destellos -->
    <g>
      <ellipse cx="256" cy="486" rx="120" ry="14" fill="url(#flare)" opacity="0.55"/>
      <circle cx="256" cy="490" r="30" fill="url(#flare)"/>
      <path d="M256 456 L260.5 484 L256 514 L251.5 484 Z" fill="#FFFBE0"/>
      <path d="M220 490 L256 485 L292 490 L256 495 Z" fill="#FFFBE0" opacity="0.9"/>
      <circle cx="104" cy="392" r="16" fill="url(#flare)"/>
      <circle cx="408" cy="392" r="14" fill="url(#flare)" opacity="0.8"/>
    </g>
  </g>
</svg>
