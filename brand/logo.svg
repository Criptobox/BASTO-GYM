<svg xmlns="http://www.w3.org/2000/svg" viewBox="-111 -24 1040 1040" role="img" aria-label="BASTO GYM">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFE57F"/><stop offset="0.3" stop-color="#FFC21F"/>
      <stop offset="0.7" stop-color="#E69A00"/><stop offset="1" stop-color="#B87800"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#FFDB63"/><stop offset="0.35" stop-color="#F3B200"/>
      <stop offset="1" stop-color="#C98400"/>
    </linearGradient>
    <linearGradient id="goldBracket" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFEB94"/><stop offset="0.5" stop-color="#FFC62E"/><stop offset="1" stop-color="#F0A500"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#26282c"/><stop offset="1" stop-color="#121315"/>
    </linearGradient>
    <linearGradient id="bFill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a2c30"/><stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2D5DA"/><stop offset="0.5" stop-color="#9A9DA4"/><stop offset="1" stop-color="#6F7279"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#43454b"/><stop offset="1" stop-color="#2a2c30"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Silueta dorada: escudo con el borde del escalón y la punta superior -->
  <path fill="url(#goldFrame)" d="M28 328 L127 270 L127 185 L400 34 L487 80 L674 176 L674 294 L790 330 V688 Q790 735 744 766 L408 957 L72 766 Q28 735 28 688 Z"/>

  <path fill="none" stroke="#FFF1A8" stroke-opacity="0.85" stroke-width="3.5" stroke-linejoin="round" d="M28 328 L127 270 L127 185 L400 34 L470 72 M674 294 L790 330 V688 Q790 735 744 766 L408 957 L72 766 Q28 735 28 688 Z"/>

  <!-- Cuerpo oscuro del escudo (deja ver el marco dorado alrededor) -->
  <path fill="url(#body)" stroke="#07070a" stroke-width="7" stroke-linejoin="round" d="M59 340 L141 293 V189 L400 50 L466 76 L428 113 L602 216 V262 L757 343 V650 Q757 690 722 716 L407 890 L94 716 Q59 690 59 650 Z"/>

  <path fill="none" stroke="#B27800" stroke-opacity="0.75" stroke-width="3" stroke-linejoin="round" d="M59 340 V650 Q59 690 94 716 L407 890 L722 716 Q757 690 757 650 V343"/>

  <!-- Pestaña de arriba a la izquierda: panel gris con escalón -->
  <path fill="url(#tab)" d="M141 189 L400 50 L400 68 L190 183 V232 L170 244 L141 262 Z"/>
  <path fill="none" stroke="#6b6e75" stroke-width="3" stroke-linejoin="round" d="M141 262 L170 244 L190 232 V183 L400 68"/>
  <path fill="none" stroke="#0a0a0b" stroke-opacity="0.8" stroke-width="3" stroke-linejoin="round" d="M141 269 L173 252 L196 238 V188 L400 76"/>

  <!-- Soporte dorado grueso arriba a la derecha, con su pierna -->
  <path fill="url(#goldBracket)" d="M415 116 L487 80 L674 176 V294 L602 262 V216 L430 118 Z"/>
  <path fill="none" stroke="#FFF3B5" stroke-opacity="0.8" stroke-width="3" stroke-linejoin="round" d="M432 112 L487 87 L668 181"/>
  <path fill="none" stroke="#A66A00" stroke-opacity="0.5" stroke-width="3" d="M430 120 L602 218 V262"/>

  <!-- B: solo contorno de acero, con dos huecos -->
  <path fill="url(#bFill)" stroke="url(#steel)" stroke-width="9" stroke-linejoin="round" d="M384 191 V445 L330 518 L384 578 V835 L85 671 V353 Z"/>
  <path fill="#101113" stroke="url(#steel)" stroke-width="7" stroke-linejoin="round" d="M155 415 L303 335 L305 442 L268 483 H155 Z"/>
  <path fill="#101113" stroke="url(#steel)" stroke-width="7" stroke-linejoin="round" d="M155 548 H268 L305 592 V712 L155 640 Z"/>

  <!-- G: dorado macizo con bisel -->
  <path fill="url(#gold)" stroke="#8F5C00" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"
        d="M427 209 L729 364 L732 444 L500 339 V703 H518 L648 630 V561 L567 558 L625 499 L727 502 L732 652 L706 695 L413 848 V569 L371 516 L412 471 V312 Z"/>
  <path fill="none" stroke="#FFF6C4" stroke-opacity="0.75" stroke-width="3.5" stroke-linejoin="round" d="M430 222 L722 372 M414 318 V470 M416 580 V835"/>
  <path fill="url(#gloss)" opacity="0.35" d="M427 209 L729 364 L732 444 L500 339 L500 380 L412 340 V312 Z"/>
</svg>
